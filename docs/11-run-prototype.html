<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Run Prototype</title>
<style>
/* Prototype of the guided measurement run (docs/11-review.md §3).
   Looks like firmware/web/index.html. Everything simulated, time runs 60 times faster. */
html, body { margin: 0; }
* { box-sizing: border-box; }
body { background: #eef1f4; color: #16202a;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px;
  padding: 150px 10px 40px; }
.wrap { max-width: 900px; margin: 0 auto; }
.pin { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: #eef1f4;
  padding: 8px 10px 6px; box-shadow: 0 2px 6px rgba(22,32,42,.12); }
.pin .wrap { position: relative; }
.head { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #64737f;
  font-weight: 700; margin: 2px 0 6px; }
.head .sim { float: right; background: #f3d9a4; color: #6b4b00; border-radius: 4px;
  padding: 2px 8px; letter-spacing: 0; text-transform: none; font-weight: 700; }
.tiles { margin: -4px -4px 4px; }
.tiles:after { content: ""; display: table; clear: both; }
.tile { float: left; width: 25%; padding: 4px; }
.tile.half { width: 50%; }
.tile.third { width: 33.333%; }
.tile > div { background: #fff; border-left: 6px solid #2f6f99; border-radius: 4px; padding: 7px 11px 9px; }
.lab { font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: #64737f; white-space: nowrap; }
.val { font-size: 34px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.15; }
.val small { font-size: 14px; color: #8795a1; margin-left: 3px; font-weight: 400; }
.val.dim { color: #aab4bd; }
.note { border-radius: 4px; padding: 8px 12px; font-size: 13px; margin: 4px 0 0;
  background: #e4ecf2; border-left: 6px solid #2f6f99; color: #28475c; }
.note.bad { background: #c0392b; border-left-color: #8e2117; color: #fff; font-size: 16px; font-weight: 700; }
.note.warn { background: #f3d9a4; border-left-color: #b57a00; color: #4a3300; font-weight: 700; }

h2 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #64737f; margin: 18px 0 6px; font-weight: 700; }
ol.steps { list-style: none; margin: 0 0 10px; padding: 0; }
ol.steps li { padding: 9px 12px; border-radius: 6px; margin-bottom: 4px; font-size: 16px;
  color: #8795a1; background: #e3e8ec; }
ol.steps li .k { display: inline-block; width: 26px; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }
ol.steps li.done { color: #1f8a5c; background: #e1f3ea; }
ol.steps li.skip { color: #6b4b00; background: #f6e7c3; }
ol.steps li.now  { color: #16202a; background: #fff; font-weight: 700; border-left: 6px solid #2f6f99; }
ol.steps li.bad  { color: #fff; background: #c0392b; font-weight: 700; }
ol.steps li small { display: block; font-weight: 400; font-size: 13px; color: inherit; opacity: .85; margin-left: 26px; }
ol.steps li .tag { float: right; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; font-weight: 700; margin-top: 4px; }

.panel { background: #fff; border-radius: 6px; padding: 12px 14px 14px; margin: 6px 0 14px;
  border-left: 6px solid #2f6f99; }
.panel .title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.panel .txt { font-size: 15px; color: #28475c; line-height: 1.5; margin-bottom: 10px; }
.btns { margin: 10px -3px 0; }
.btns:after { content: ""; display: table; clear: both; }
.btns button { -webkit-appearance: none; border: 0; cursor: pointer; font-family: inherit;
  font-size: 17px; font-weight: 700; border-radius: 6px; padding: 14px 0; width: calc(33.333% - 6px);
  margin: 3px; float: left; background: #c3ccd4; color: #16202a; }
.btns button.go { background: #2f6f99; color: #fff; }
.btns button.stop { background: #c0392b; color: #fff; }
.btns button.wide { width: calc(100% - 6px); }
.btns button.half { width: calc(50% - 6px); }
.btns button:disabled { opacity: .4; cursor: default; }

.field { margin-bottom: 8px; }
.field label { display: block; font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: #64737f; margin-bottom: 4px; }
.field input, .field select { -webkit-appearance: none; border: 1px solid #c3ccd4; border-radius: 5px; padding: 9px 10px;
  font-family: inherit; font-size: 18px; font-variant-numeric: tabular-nums; width: 100%; color: #16202a; background: #fbfcfd; }
.cols { margin: 0 -4px; }
.cols:after { content: ""; display: table; clear: both; }
.cols .field { float: left; width: 50%; padding: 0 4px; }
.cols.three .field { width: 33.333%; }

table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid #e3e8ec; white-space: nowrap; }
th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #64737f; font-weight: 700; }
th:first-child, td:first-child { text-align: left; }
td.ok { color: #1f8a5c; font-weight: 700; }
td.miss { color: #c0392b; font-weight: 700; }
td.skip { color: #b57a00; font-weight: 700; }
td.dim { color: #aab4bd; }
.tablewrap { overflow-x: auto; }

.bar { height: 10px; background: #e3e8ec; border-radius: 5px; margin: 8px 0 4px; overflow: hidden; }
.bar div { height: 100%; width: 0; background: #2f6f99; }
.small { font-size: 12px; color: #7d8a95; }
pre { background: #16202a; color: #dfe6ec; border-radius: 6px; padding: 12px 14px; font-size: 12px;
  overflow-x: auto; line-height: 1.45; white-space: pre; }
a.dl { display: inline-block; background: #2f6f99; color: #fff; text-decoration: none; font-weight: 700;
  border-radius: 6px; padding: 12px 18px; margin: 6px 6px 0 0; }
.spark { display: block; width: 100%; height: 70px; background: #fbfcfd; border-radius: 4px; margin-top: 6px; }
</style>
</head>
<body>


<div class="pin"><div class="wrap">
  <div class="head">Run <span id="runId">2026-11-23-03</span> <span class="sim">Simulation ×60</span></div>
  <div class="tiles">
    <div class="tile half"><div><div class="lab">Target</div><div class="val" id="target">0<small>km/h</small></div></div></div>
    <div class="tile half"><div><div class="lab">Actual</div><div class="val" id="actual">0.0<small>km/h</small></div></div></div>
  </div>
  <div class="note bad" id="err" hidden></div>
  <div class="note" id="hint" hidden></div>
</div></div>

<div class="wrap">
  <div class="tiles" id="liveTiles" hidden>
    <div class="tile"><div><div class="lab">Torque</div><div class="val" id="lvM">—<small>Nm</small></div></div></div>
    <div class="tile"><div><div class="lab">Power</div><div class="val" id="lvP">—<small>W</small></div></div></div>
    <div class="tile"><div><div class="lab">Crr raw</div><div class="val" id="lvC">—</div></div></div>
    <div class="tile"><div><div class="lab">Crr corr.</div><div class="val" id="lvK">—</div></div></div>
  </div>

  <div class="panel" id="panel"></div>

  <h2>A · Preparation</h2>
  <ol class="steps" id="listA"></ol>
  <h2>B · Measurement run</h2>
  <ol class="steps" id="listB"></ol>
  <h2>C · Completion</h2>
  <ol class="steps" id="listC"></ol>
</div>

<script>
// ---------- Model of the test stand (simulated) ----------
var U = 2.842, R = U / (2 * Math.PI), LOAD = 494.3;
var A0 = 0.031, B0 = 2.55e-4;        // idle [Nm], [Nm/(rad/s)^2]
var A1 = 0.01627, B1 = 3.673e-5;     // wheel
var rWheel = 2.105 / (2 * Math.PI);
var CAL_TIME = "2026-11-23 15:41";
function omega(kmh) { return kmh / 3.6 / R; }
function mIdle(kmh) { var w = omega(kmh); return A0 + B0 * w * w; }
function mWheel(kmh)  { var w = omega(kmh) * R / rWheel; return (A1 + B1 * w * w) * R / rWheel; }
function crrTrue(kmh, warm) { return (0.00405 + 0.000011 * (kmh - 15)) * (warm ? 1 : 1.07); }
function gauss() { var u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function mTotal(kmh, warm) { return mIdle(kmh) + mWheel(kmh) + crrTrue(kmh, warm) * LOAD * R; }

// ---------- State ----------
var S = { target: 0, actual: 0, step: 0, meta: {}, checks: [], warn: [], points: [], warmup: [],
  anchor: null, baseline: [], postRun: null, tareSigma: null, ctrlDev: null, startTime: null,
  faultInjected: false };
var SPEEDUP = 60;
var tickers = [];
function $(id) { return document.getElementById(id); }
function fmt(x, d) { return (x === null || x === undefined || isNaN(x)) ? "—" : x.toFixed(d); }
function now() { return new Date(); }
function hm(d) { return d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2); }
function warn(code, text) { S.warn.push(code + " " + text); }

// Speed simulation: actual follows target with a ramp
setInterval(function () {
  var dt = 0.2 * SPEEDUP / 10;   // slowed-down simulation so the ramp is visible
  var diff = S.target - S.actual;
  var step = Math.min(Math.abs(diff), 2.2 * dt);
  if (S.target < S.actual && S.actual > 45 && S.target === 0) step = Math.min(Math.abs(diff), 0.47 * dt); // coast-down above 45
  S.actual += Math.sign(diff) * step;
  if (Math.abs(diff) < 0.4) S.actual = S.target + 0.15 * gauss();
  if (S.actual < 0) S.actual = 0;
  $("target").innerHTML = fmt(S.target, 0) + "<small>km/h</small>";
  $("actual").innerHTML = fmt(S.actual, 1) + "<small>km/h</small>";
  var steady = Math.abs(S.actual - S.target) < 1 && S.target > 0;
  var lt = $("liveTiles");
  if (S.target > 0) {
    lt.hidden = false;
    if (steady) {
      var m = mTotal(S.actual, S.step >= 10) + 0.004 * gauss();
      var p = m * omega(S.actual);
      var crrRaw = m / R / LOAD, crrCorr = (m - mIdle(S.actual) - mWheel(S.actual)) / R / LOAD;
      $("lvM").innerHTML = fmt(m, 3) + "<small>Nm</small>";
      $("lvP").innerHTML = fmt(p, 1) + "<small>W</small>";
      $("lvC").innerHTML = fmt(crrRaw, 4);
      $("lvK").innerHTML = fmt(crrCorr, 4);
    } else {
      $("lvM").innerHTML = "—<small>Nm</small>"; $("lvP").innerHTML = "—<small>W</small>";
      $("lvC").innerHTML = "—"; $("lvK").innerHTML = "—";
    }
  } else { lt.hidden = true; }
}, 200);

// ---------- Steps ----------
var STEPS = [
  { id: 1,  grp: "A", t: "Create run",               tag: "input" },
  { id: 2,  grp: "A", t: "Visual check, e-stop",     tag: "manual" },
  { id: 3,  grp: "A", t: "System check",             tag: "auto" },
  { id: 4,  grp: "A", t: "Tare",                     tag: "auto" },
  { id: 5,  grp: "A", t: "Check weight",             tag: "manual · optional" },
  { id: 6,  grp: "A", t: "Idle-loss model",          tag: "manual + auto" },
  { id: 7,  grp: "A", t: "Wheel model",              tag: "manual + auto" },
  { id: 8,  grp: "A", t: "Wheel lowered, load",      tag: "manual" },
  { id: 9,  grp: "B", t: "Warm-up 28.8 km/h · 30 min", tag: "auto" },
  { id: 10, grp: "B", t: "Plateaus, 3 × 10 revolutions each", tag: "auto" },
  { id: 11, grp: "B", t: "Reference point 28.8 km/h", tag: "auto" },
  { id: 12, grp: "B", t: "Coast-down",               tag: "auto" },
  { id: 13, grp: "C", t: "Post-run idle check",      tag: "manual · optional" },
  { id: 14, grp: "C", t: "Report",                   tag: "auto" }
];
var state = {}; // id -> {cls, sub}

function renderLists() {
  ["A", "B", "C"].forEach(function (g) {
    var html = "";
    STEPS.filter(function (s) { return s.grp === g; }).forEach(function (s) {
      var st = state[s.id] || {};
      var cls = st.cls || (s.id === S.step ? "now" : "");
      html += '<li class="' + cls + '"><span class="k">' + s.id + '</span>' + s.t +
        '<span class="tag">' + s.tag + '</span>' + (st.sub ? '<small>' + st.sub + '</small>' : '') + '</li>';
    });
    $("list" + g).innerHTML = html;
  });
}
function done(id, sub, cls) { state[id] = { cls: cls || "done", sub: sub || "" }; }
function setHint(t) { var h = $("hint"); h.hidden = !t; h.textContent = t || ""; }
function setErr(t) { var e = $("err"); e.hidden = !t; e.textContent = t || ""; }
function clearTickers() { tickers.forEach(clearInterval); tickers = []; }
function go(step) { clearTickers(); S.step = step; renderLists(); PANEL[step](); window.scrollTo(0, 0); }

var PANEL = {};

// 1 Create run
PANEL[1] = function () {
  $("panel").innerHTML =
    '<div class="title">Create run</div>' +
    '<div class="cols"><div class="field"><label>Tyre</label><input id="fTire" value="Conti GP5000 S TR 28"></div>' +
    '<div class="field"><label>Wheel</label><select id="fWheel"><option>LR-01 DT Swiss 1850, 28″</option><option>LR-02 Mavic</option></select></div></div>' +
    '<div class="cols three"><div class="field"><label>Pressure</label><input id="fBar" value="5.0" inputmode="decimal"> </div>' +
    '<div class="field"><label>Room °C</label><input id="fTemp" value="" placeholder="—" inputmode="decimal"></div>' +
    '<div class="field"><label>Load kg</label><input id="fLoad" value="50.4" inputmode="decimal"></div></div>' +
    '<div class="cols"><div class="field"><label>Sliding weight position mm</label><input id="fPos" value="312" inputmode="numeric"></div>' +
    '<div class="field"><label>Note</label><input id="fNote" value="A/B/A, reference 1"></div></div>' +
    '<div class="btns"><button class="go wide" onclick="finish1()">Next</button></div>';
};
function finish1() {
  S.meta = { tire: $("fTire").value, wheel: $("fWheel").value, bar: $("fBar").value, temp: $("fTemp").value,
    load: $("fLoad").value, pos: $("fPos").value, note: $("fNote").value };
  if (!S.meta.temp) warn("W07", "room temperature not entered");
  S.startTime = now();
  done(1, S.meta.tire + " · " + S.meta.wheel + " · " + S.meta.bar + " bar · " + S.meta.load + " kg");
  go(2);
}

// 2 Visual check
PANEL[2] = function () {
  $("panel").innerHTML =
    '<div class="title">Visual check</div>' +
    '<div class="txt">Drum, weighing part free, coupling, wheel secured, blocking wedge out, e-stop within reach.</div>' +
    '<div class="btns"><button class="go wide" onclick="done(2, \'confirmed \' + hm(now())); go(3)">Checked</button></div>';
};

// 3 System check (auto)
PANEL[3] = function () {
  var checks = [
    ["Controller", "ok", "FW 7.01 · 41.9 V · no fault"],
    ["Motor on controller", "ok", "disconnect quiet"],
    ["Load cell", "ok", "responds · 2 % of full scale"],
    ["Noise at standstill", "ok", "σ = 1.8 counts (5 s)"],
    ["Calibration factor", "ok", "2.668e-5 N/count · " + CAL_TIME],
    ["Tare", "miss", "older than last intervention → step 4"],
    ["Idle-loss model A₀/B₀", "miss", "stored 11:52, 4 points · older than session → step 6"],
    ["Wheel model A₁/B₁", "ok", "LR-01 · 18:02 · J = 0.0765 kg·m²"],
    ["Wheel circumference", "ok", "2105 mm · steady, 10 rev"],
    ["Plateaus", "ok", "15 · 28.8 · 40 · 50 · 60 km/h"]
  ];
  S.checks = checks;
  var html = '<div class="title">System check</div><div class="tablewrap"><table><tr><th>Check</th><th>Result</th><th>Value</th></tr>';
  checks.forEach(function (c, i) {
    html += '<tr id="chk' + i + '"><td>' + c[0] + '</td><td class="dim">…</td><td class="dim"></td></tr>';
  });
  html += '</table></div><div class="btns"><button class="go wide" id="b3" disabled>Next</button></div>';
  $("panel").innerHTML = html;
  var i = 0;
  var t = setInterval(function () {
    if (i >= checks.length) { clearInterval(t); $("b3").disabled = false;
      $("b3").onclick = function () { done(3, "8 ok · 2 due"); go(4); }; return; }
    var c = checks[i], row = $("chk" + i);
    row.cells[1].className = c[1]; row.cells[1].textContent = c[1] === "ok" ? "ok" : "due";
    row.cells[2].className = ""; row.cells[2].textContent = c[2];
    i++;
  }, 180);
  tickers.push(t);
};

// 4 Tare
PANEL[4] = function () {
  $("panel").innerHTML = '<div class="title">Tare</div><div class="txt">Drum at standstill. 200 samples.</div>' +
    '<div class="bar"><div id="bar4"></div></div><div class="small" id="t4">—</div>' +
    '<div class="btns"><button class="go wide" id="b4" disabled>Next</button></div>';
  var n = 0, t = setInterval(function () {
    n += 8; $("bar4").style.width = Math.min(100, n / 2) + "%";
    if (n >= 200) { clearInterval(t); S.tareSigma = 1.7 + 0.3 * Math.random();
      $("t4").textContent = "Offset 269 878 counts · σ = " + fmt(S.tareSigma, 1) + " counts";
      $("b4").disabled = false; $("b4").onclick = function () { done(4, "σ " + fmt(S.tareSigma, 1) + " counts"); go(5); }; }
  }, 60);
  tickers.push(t);
};

// 5 Check weight
PANEL[5] = function () {
  $("panel").innerHTML = '<div class="title">Check weight</div>' +
    '<div class="txt">Hang 1000 g at 330 mm. Target 3.237 Nm.</div>' +
    '<div class="tiles"><div class="tile half"><div><div class="lab">Actual</div><div class="val" id="cw">—<small>Nm</small></div></div></div>' +
    '<div class="tile half"><div><div class="lab">Deviation</div><div class="val" id="cd">—<small>%</small></div></div></div></div>' +
    '<div class="btns"><button class="half" onclick="skip5()">Skip</button><button class="go half" onclick="hang5()">Hanging</button></div>';
};
function skip5() { warn("W01", "check weight skipped"); done(5, "skipped (W01)", "skip"); go(6); }
function hang5() {
  var val = 3.237 * (1 + 0.0028 * gauss()), dev = (val / 3.237 - 1) * 100;
  S.ctrlDev = dev;
  $("cw").innerHTML = fmt(val, 3) + "<small>Nm</small>";
  $("cd").innerHTML = (dev >= 0 ? "+" : "") + fmt(dev, 2) + "<small>%</small>";
  var ok = Math.abs(dev) < 0.5;
  $("panel").querySelector(".btns").innerHTML = ok
    ? '<button class="go wide" onclick="done(5, \'' + (dev >= 0 ? "+" : "") + fmt(dev, 2) + ' %\'); go(6)">Next</button>'
    : '<button class="half" onclick="PANEL[5]()">Again</button><button class="stop half" onclick="setErr(\'Check weight ' + fmt(dev, 2) + ' %: check calibration\')">Abort</button>';
}

// 6 Idle-loss model
PANEL[6] = function () {
  $("panel").innerHTML = '<div class="title">Idle-loss model</div>' +
    '<div class="txt">Stored 11:52, 4 points, older than this session.</div>' +
    '<div class="btns"><button class="half" onclick="keep6()">Adopt</button><button class="go half" onclick="lift6()">Run new</button></div>';
};
function keep6() { warn("W02", "idle-loss model older than the session adopted"); done(6, "adopted 11:52 (W02)", "skip"); go(7); }
function lift6() {
  $("panel").innerHTML = '<div class="title">Lift wheel</div><div class="txt">Eccentric lever. Wheel clear of the drum.</div>' +
    '<div class="btns"><button class="go wide" onclick="runBaseline(6)">Lifted</button></div>';
}
var PLATEAUS = [15, 28.8, 40, 50, 60];
function runBaseline(step) {
  var pts = [];
  var html = '<div class="title">' + (step === 6 ? "Idle run before" : "Idle run after") + '</div>' +
    '<div class="tablewrap"><table id="tb"><tr><th>km/h</th><th>M Nm</th><th>σ</th>' + (step === 13 ? '<th>Δ to before</th><th>on F_roll</th>' : '') + '</tr></table></div>' +
    '<div class="small" id="fit"></div><div class="btns"><button class="go wide" id="bB" disabled>Next</button></div>';
  $("panel").innerHTML = html;
  var i = 0;
  function next() {
    if (i >= PLATEAUS.length) {
      S.target = 0; setHint("");
      if (step === 6) {
        S.baseline = pts;
        var fit = fitAB(pts);
        $("fit").textContent = "A₀ = " + fmt(fit.a, 4) + " Nm · B₀ = " + fit.b.toExponential(3) + " Nm/(rad/s)² · drift vs 11:52: +1.9 %";
        $("bB").disabled = false;
        $("bB").onclick = function () { done(6, "A₀ " + fmt(fit.a, 4) + " · B₀ " + fit.b.toExponential(2) + " · 5 points"); lower6(); };
      } else {
        S.postRun = pts;
        var worst = 0; pts.forEach(function (p, k) { worst = Math.max(worst, Math.abs(p.m - S.baseline[k].m) / R); });
        $("fit").textContent = "largest deviation " + fmt(worst, 3) + " N on F_roll · criterion 0.02 N → " + (worst < 0.02 ? "ok" : "discard");
        if (worst >= 0.02) warn("W08", "idle drift " + fmt(worst, 3) + " N above 0.02 N");
        $("bB").disabled = false;
        $("bB").onclick = function () { done(13, "drift max " + fmt(worst, 3) + " N"); go(14); };
      }
      return;
    }
    var v = PLATEAUS[i]; S.target = v; setHint("Plateau " + fmt(v, 1) + " km/h · settling");
    var wait = setInterval(function () {
      if (Math.abs(S.actual - v) < 1) { clearInterval(wait);
        setTimeout(function () {
          var m = mIdle(v) * (step === 13 ? 1.012 : 1) + 0.003 * gauss(), sg = 0.002 + 0.002 * Math.random();
          pts.push({ v: v, m: m, s: sg });
          var tr = $("tb").insertRow(-1);
          var cells = [fmt(v, 1), fmt(m, 4), fmt(sg, 4)];
          if (step === 13) { var d = m - S.baseline[i].m; cells.push((d >= 0 ? "+" : "") + fmt(d, 4)); cells.push(fmt(Math.abs(d) / R, 3) + " N"); }
          cells.forEach(function (c) { var td = tr.insertCell(-1); td.textContent = c; });
          i++; next();
        }, 900);
      }
    }, 100);
    tickers.push(wait);
  }
  next();
}
function fitAB(pts) { // M = a + b w^2, least squares
  var n = pts.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
  pts.forEach(function (p) { var x = omega(p.v); x *= x; sx += x; sy += p.m; sxx += x * x; sxy += x * p.m; });
  var b = (n * sxy - sx * sy) / (n * sxx - sx * sx), a = (sy - b * sx) / n; return { a: a, b: b };
}
function lower6() {
  renderLists();

PANEL[7] = function () {

// 8 Wheel lowered
PANEL[8] = function () {

// 9 Warm-up
PANEL[9] = function () {
  S.target = 28.8; setHint("");
  $("panel").innerHTML = '<div class="title">Warm-up</div><div class="txt">28.8 km/h · 30 min · one live point per minute.</div>' +
    '<div class="bar"><div id="bar9"></div></div><div class="small" id="t9">0 min</div>' +
    '<canvas class="spark" id="sp9" width="800" height="70"></canvas>' +
    '<div class="btns"><button class="stop wide" onclick="S.target=0;setErr(\'Aborted by operator\')">Stop</button></div>';
  var min = 0, warmFactor;
  var t = setInterval(function () {
    if (Math.abs(S.actual - 28.8) > 1) return;
    min++;
    warmFactor = 1 + 0.07 * Math.exp(-min / 9);
    var m = mIdle(28.8) + mWheel(28.8) + 0.00420 * warmFactor * LOAD * R + 0.003 * gauss();
    S.warmup.push({ min: min, p: m * omega(28.8), crr: (m - mIdle(28.8) - mWheel(28.8)) / R / LOAD });
    $("bar9").style.width = (min / 30 * 100) + "%";
    $("t9").textContent = min + " min · P " + fmt(S.warmup[S.warmup.length - 1].p, 1) + " W · Crr " + fmt(S.warmup[S.warmup.length - 1].crr, 5);
    drawSpark();
    if (min >= 30) { clearInterval(t);
      var last5 = S.warmup.slice(-6), ch = (last5[last5.length - 1].p / last5[0].p - 1) * 100;
      done(9, "30 min · P " + fmt(S.warmup[29].p, 1) + " W · change last 5 min " + fmt(ch, 1) + " %");
      go(10); }
  }, 250);
  tickers.push(t);
};
function drawSpark() {
  var c = $("sp9"); if (!c) return; var g = c.getContext("2d"); g.clearRect(0, 0, 800, 70);
  g.strokeStyle = "#2f6f99"; g.lineWidth = 2; g.beginPath();
  var ps = S.warmup.map(function (w) { return w.p; }), mx = Math.max.apply(null, ps), mn = Math.min.apply(null, ps) - 0.5;
  S.warmup.forEach(function (w, i) { var x = 10 + i / 29 * 780, y = 62 - (w.p - mn) / (mx - mn + 0.01) * 54; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
}

// 10 plateaus
PANEL[10] = function () {
  var html = '<div class="title">Plateaus</div><div class="tablewrap"><table id="tp"><tr><th>km/h</th><th>Point</th><th>M Nm</th><th>σ_U</th><th>Crr raw</th><th>Crr corr.</th><th>valid</th></tr></table></div>' +
    '<div class="btns"><button class="stop wide" onclick="S.target=0;setErr(\'Aborted by operator\')">Stop</button></div>';
  $("panel").innerHTML = html;
  var i = 0, k = 0;
  function next() {
    if (i >= PLATEAUS.length) { done(10, S.points.length + " points · " + S.points.filter(function (p) { return !p.ok; }).length + " invalid"); go(11); return; }
    var v = PLATEAUS[i]; S.target = v; setHint("Plateau " + fmt(v, 1) + " km/h · settling 15 s");
    var wait = setInterval(function () {
      if (Math.abs(S.actual - v) < 1) { clearInterval(wait); setHint("Plateau " + fmt(v, 1) + " km/h · point " + (k + 1) + "/3");
        setTimeout(function () {
          var bad = (!S.faultInjected && v === 50 && k === 1); if (bad) S.faultInjected = true;
          var m = mTotal(v, true) + 0.004 * gauss() + (bad ? 0.05 : 0), sg = 0.003 + 0.003 * Math.random();
          var p = { v: v, k: k + 1, m: m, s: sg, crrRaw: m / R / LOAD, crrCorr: (m - mIdle(v) - mWheel(v)) / R / LOAD, ok: !bad, why: bad ? "dv/dt 0.6 km/h/s" : "" };
          S.points.push(p);
          if (bad) warn("W03", "point 50 km/h #2 invalid: " + p.why);
          var tr = $("tp").insertRow(-1);
          [fmt(v, 1), p.k, fmt(m, 4), fmt(sg, 4), fmt(p.crrRaw, 5), fmt(p.crrCorr, 5), p.ok ? "yes" : "no · " + p.why].forEach(function (c, j) {
            var td = tr.insertCell(-1); td.textContent = c; if (j === 6) td.className = p.ok ? "ok" : "miss"; });
          k++; if (k >= 3) { k = 0; i++; }
          next();
        }, 700);
      }
    }, 100);
    tickers.push(wait);
  }
  next();
};

// 11 Reference point
PANEL[11] = function () {
  S.target = 28.8; setHint("Reference point 28.8 km/h");
  $("panel").innerHTML = '<div class="title">Reference point</div><div class="txt">Repeat 28.8 km/h, drift against the first point.</div><div class="small" id="t11">…</div>';
  var wait = setInterval(function () {
    if (Math.abs(S.actual - 28.8) < 1) { clearInterval(wait);
      setTimeout(function () {
        var first = S.points.filter(function (p) { return p.v === 28.8; });
        var m0 = first.reduce(function (a, p) { return a + p.m; }, 0) / first.length;
        var m = mTotal(28.8, true) * 1.004 + 0.004 * gauss();
        S.anchor = { m0: m0, m: m, d: m - m0, dcrr: (m - m0) / R / LOAD };
        if (Math.abs(S.anchor.d) / R > 0.03) warn("W04", "reference-point drift " + fmt(Math.abs(S.anchor.d) / R, 3) + " N on F_roll");
        $("t11").textContent = "ΔM " + (S.anchor.d >= 0 ? "+" : "") + fmt(S.anchor.d, 4) + " Nm · ΔCrr " + (S.anchor.dcrr >= 0 ? "+" : "") + fmt(S.anchor.dcrr, 5);
        done(11, "ΔCrr " + (S.anchor.dcrr >= 0 ? "+" : "") + fmt(S.anchor.dcrr, 5));
        setTimeout(function () { go(12); }, 800);
      }, 1200);
    }
  }, 100);
  tickers.push(wait);
};

PANEL[13] = function () {

function lift13() { if (!S.baseline.length) { S.baseline = PLATEAUS.map(function (v) { return { v: v, m: mIdle(v) }; }); } runBaseline(13); }

// 14 Report
PANEL[14] = function () {
  S.target = 0; setHint("");
  done(14, "finished " + hm(now()));

  var md = protokoll();

function plateauStats() {
  return PLATEAUS.map(function (v) {
    var ps = S.points.filter(function (p) { return p.v === v && p.ok; });
    var n = ps.length, mm = ps.reduce(function (a, p) { return a + p.m; }, 0) / n;
    var sd = Math.sqrt(ps.reduce(function (a, p) { return a + (p.m - mm) * (p.m - mm); }, 0) / Math.max(1, n - 1));
    var mR = mm - mIdle(v) - mWheel(v);
    var ukor = Math.sqrt(Math.pow(sd / Math.sqrt(n) / mR, 2) + Math.pow(0.002, 2) + Math.pow(0.00125, 2) + Math.pow(0.005, 2) + Math.pow(0.02 * R / mR, 2) + Math.pow(0.005, 2));
    return { v: v, n: n, m: mm, sd: sd, froll: mR / R, crrRaw: mm / R / LOAD, crrCorr: mR / R / LOAD, u: ukor * mR / R / LOAD, all: S.points.filter(function (p) { return p.v === v; }).length };
  });
}
function protokoll() {

  L.push("");

  L.push("| Tare | ok | σ = " + fmt(S.tareSigma, 1) + " counts |");
  L.push("| Check weight | " + (S.ctrlDev === null ? "skipped" : "ok") + " | " + (S.ctrlDev === null ? "W01" : (S.ctrlDev >= 0 ? "+" : "") + fmt(S.ctrlDev, 2) + " %") + " |");
  L.push("");
  L.push("## Calibration status");
  L.push("| Quantity | Value | Origin | As of |"); L.push("|---|---|---|---|");
  L.push("| U drum | 2.842 m | measured | 2026-11-23 |");
  L.push("| L cell arm | 0.084 m | measured | 2026-11-23 |");
  L.push("| N_per_count | 2.668e-5 N | calibrated 1 kg @ 330 mm | " + CAL_TIME + " |");
  L.push("| A₀ / B₀ | " + fmt(A0, 4) + " Nm / " + B0.toExponential(2) + " | idle run 5 points | " + (state[6] && state[6].cls === "skip" ? "11:52 (W02)" : hm(d)) + " |");
  L.push("| A₁ / B₁ / J_wheel | " + fmt(A1, 5) + " / " + B1.toExponential(3) + " / 0.0765 kg·m² | coast-down LR-01 | 18:02 |");
  L.push("| Wheel circumference | 2.105 m | speed ratio, 10 rev | 18:02 |");
  L.push("");
  L.push("## Warm-up 28.8 km/h");
  L.push("| min | P W | Crr corr. |"); L.push("|---|---|---|");
  S.warmup.forEach(function (w) { if (w.min % 5 === 0 || w.min === 1) L.push("| " + w.min + " | " + fmt(w.p, 1) + " | " + fmt(w.crr, 5) + " |"); });
  if (S.warmup.length >= 6) { var a = S.warmup[S.warmup.length - 6].p, b = S.warmup[S.warmup.length - 1].p; L.push(""); L.push("Change last 5 min: " + fmt((b / a - 1) * 100, 1) + " %"); }
  L.push("");
  L.push("## Measurement points");
  L.push("| v km/h | n | M Nm | σ Nm | F_roll N | Crr raw | Crr corr. | u(Crr) |"); L.push("|---|---|---|---|---|---|---|---|");
  plateauStats().forEach(function (s) {
    L.push("| " + fmt(s.v, 1) + " | " + s.n + "/" + s.all + " | " + fmt(s.m, 4) + " | " + fmt(s.sd, 4) + " | " + fmt(s.froll, 3) + " | " + fmt(s.crrRaw, 5) + " | " + fmt(s.crrCorr, 5) + " | ± " + fmt(s.u, 5) + " |");
  });
  L.push("");
  L.push("## Reference point 28.8 km/h");
  if (S.anchor) L.push("ΔM " + (S.anchor.d >= 0 ? "+" : "") + fmt(S.anchor.d, 4) + " Nm · ΔCrr " + (S.anchor.dcrr >= 0 ? "+" : "") + fmt(S.anchor.dcrr, 5) + " · " + fmt(Math.abs(S.anchor.d) / R, 3) + " N on F_roll");
  L.push("");
  L.push("## Idle run before/after");
  if (S.postRun) {
    L.push("| v km/h | before Nm | after Nm | Δ on F_roll N |"); L.push("|---|---|---|---|");
    S.postRun.forEach(function (p, i) { L.push("| " + fmt(p.v, 1) + " | " + fmt(S.baseline[i].m, 4) + " | " + fmt(p.m, 4) + " | " + fmt(Math.abs(p.m - S.baseline[i].m) / R, 3) + " |"); });
  } else L.push("Post-run idle check not run (W05).");
  L.push("");
  L.push("## Warnings");
  if (!S.warn.length) L.push("none"); else S.warn.forEach(function (w) { L.push("- " + w); });
  L.push("");
  L.push("## Raw data");
  L.push("run-" + id + ".csv · " + (S.points.length + S.warmup.length + S.baseline.length + (S.postRun ? S.postRun.length : 0) + 1) + " rows");
  return L.join("\n");
}
