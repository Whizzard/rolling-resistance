<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messlauf · Prototyp</title>
<style>
/* Prototyp des gefuehrten Messlaufs (docs/11-messablauf-review.md §3).
   Optik wie firmware/web/index.html. Alles simuliert, Zeit laeuft 60-fach. */
html, body { margin: 0; }
* { box-sizing: border-box; }
body { background: #eef1f4; color: #16202a;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px;
  padding: 150px 10px 40px; }
.wrap { max-width: 900px; margin: 0 auto; }
.pin { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: #eef1f4;
  padding: 8px 10px 6px; box-shadow: 0 2px 6px rgba(22,32,42,.12); }
.pin .wrap { position: relative; }
.head { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #64737f;
  font-weight: 700; margin: 2px 0 6px; }
.head .sim { float: right; background: #f3d9a4; color: #6b4b00; border-radius: 4px;
  padding: 2px 8px; letter-spacing: 0; text-transform: none; font-weight: 700; }
.tiles { margin: -4px -4px 4px; }
.tiles:after { content: ""; display: table; clear: both; }
.tile { float: left; width: 25%; padding: 4px; }
.tile.half { width: 50%; }
.tile.third { width: 33.333%; }
.tile > div { background: #fff; border-left: 6px solid #2f6f99; border-radius: 4px; padding: 7px 11px 9px; }
.lab { font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: #64737f; white-space: nowrap; }
.val { font-size: 34px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.15; }
.val small { font-size: 14px; color: #8795a1; margin-left: 3px; font-weight: 400; }
.val.dim { color: #aab4bd; }
.note { border-radius: 4px; padding: 8px 12px; font-size: 13px; margin: 4px 0 0;
  background: #e4ecf2; border-left: 6px solid #2f6f99; color: #28475c; }
.note.bad { background: #c0392b; border-left-color: #8e2117; color: #fff; font-size: 16px; font-weight: 700; }
.note.warn { background: #f3d9a4; border-left-color: #b57a00; color: #4a3300; font-weight: 700; }

h2 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #64737f; margin: 18px 0 6px; font-weight: 700; }
ol.steps { list-style: none; margin: 0 0 10px; padding: 0; }
ol.steps li { padding: 9px 12px; border-radius: 6px; margin-bottom: 4px; font-size: 16px;
  color: #8795a1; background: #e3e8ec; }
ol.steps li .k { display: inline-block; width: 26px; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }
ol.steps li.done { color: #1f8a5c; background: #e1f3ea; }
ol.steps li.skip { color: #6b4b00; background: #f6e7c3; }
ol.steps li.now  { color: #16202a; background: #fff; font-weight: 700; border-left: 6px solid #2f6f99; }
ol.steps li.bad  { color: #fff; background: #c0392b; font-weight: 700; }
ol.steps li small { display: block; font-weight: 400; font-size: 13px; color: inherit; opacity: .85; margin-left: 26px; }
ol.steps li .tag { float: right; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; font-weight: 700; margin-top: 4px; }

.panel { background: #fff; border-radius: 6px; padding: 12px 14px 14px; margin: 6px 0 14px;
  border-left: 6px solid #2f6f99; }
.panel .title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.panel .txt { font-size: 15px; color: #28475c; line-height: 1.5; margin-bottom: 10px; }
.btns { margin: 10px -3px 0; }
.btns:after { content: ""; display: table; clear: both; }
.btns button { -webkit-appearance: none; border: 0; cursor: pointer; font-family: inherit;
  font-size: 17px; font-weight: 700; border-radius: 6px; padding: 14px 0; width: calc(33.333% - 6px);
  margin: 3px; float: left; background: #c3ccd4; color: #16202a; }
.btns button.go { background: #2f6f99; color: #fff; }
.btns button.stop { background: #c0392b; color: #fff; }
.btns button.wide { width: calc(100% - 6px); }
.btns button.half { width: calc(50% - 6px); }
.btns button:disabled { opacity: .4; cursor: default; }

.field { margin-bottom: 8px; }
.field label { display: block; font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: #64737f; margin-bottom: 4px; }
.field input, .field select { -webkit-appearance: none; border: 1px solid #c3ccd4; border-radius: 5px; padding: 9px 10px;
  font-family: inherit; font-size: 18px; font-variant-numeric: tabular-nums; width: 100%; color: #16202a; background: #fbfcfd; }
.cols { margin: 0 -4px; }
.cols:after { content: ""; display: table; clear: both; }
.cols .field { float: left; width: 50%; padding: 0 4px; }
.cols.three .field { width: 33.333%; }

table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid #e3e8ec; white-space: nowrap; }
th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #64737f; font-weight: 700; }
th:first-child, td:first-child { text-align: left; }
td.ok { color: #1f8a5c; font-weight: 700; }
td.miss { color: #c0392b; font-weight: 700; }
td.skip { color: #b57a00; font-weight: 700; }
td.dim { color: #aab4bd; }
.tablewrap { overflow-x: auto; }

.bar { height: 10px; background: #e3e8ec; border-radius: 5px; margin: 8px 0 4px; overflow: hidden; }
.bar div { height: 100%; width: 0; background: #2f6f99; }
.small { font-size: 12px; color: #7d8a95; }
pre { background: #16202a; color: #dfe6ec; border-radius: 6px; padding: 12px 14px; font-size: 12px;
  overflow-x: auto; line-height: 1.45; white-space: pre; }
a.dl { display: inline-block; background: #2f6f99; color: #fff; text-decoration: none; font-weight: 700;
  border-radius: 6px; padding: 12px 18px; margin: 6px 6px 0 0; }
.spark { display: block; width: 100%; height: 70px; background: #fbfcfd; border-radius: 4px; margin-top: 6px; }
</style>
</head>
<body>

<div class="pin"><div class="wrap">
  <div class="head">Messlauf <span id="runId">2026-11-23-03</span> <span class="sim">Simulation ×60</span></div>
  <div class="tiles">
    <div class="tile half"><div><div class="lab">Soll</div><div class="val" id="soll">0<small>km/h</small></div></div></div>
    <div class="tile half"><div><div class="lab">Ist</div><div class="val" id="ist">0.0<small>km/h</small></div></div></div>
  </div>
  <div class="note bad" id="err" hidden></div>
  <div class="note" id="hint" hidden></div>
</div></div>

<div class="wrap">
  <div class="tiles" id="liveTiles" hidden>
    <div class="tile"><div><div class="lab">Moment</div><div class="val" id="lvM">—<small>Nm</small></div></div></div>
    <div class="tile"><div><div class="lab">Leistung</div><div class="val" id="lvP">—<small>W</small></div></div></div>
    <div class="tile"><div><div class="lab">Crr roh</div><div class="val" id="lvC">—</div></div></div>
    <div class="tile"><div><div class="lab">Crr korr.</div><div class="val" id="lvK">—</div></div></div>
  </div>

  <div class="panel" id="panel"></div>

  <h2>A · Vorbereitung</h2>
  <ol class="steps" id="listA"></ol>
  <h2>B · Messfahrt</h2>
  <ol class="steps" id="listB"></ol>
  <h2>C · Abschluss</h2>
  <ol class="steps" id="listC"></ol>
</div>

<script>
// ---------- Modell des Pruefstands (simuliert) ----------
var U = 2.842, R = U / (2 * Math.PI), LOAD = 494.3;
var A0 = 0.031, B0 = 2.55e-4;        // Leerlauf [Nm], [Nm/(rad/s)^2]
var A1 = 0.01627, B1 = 3.673e-5;     // Laufrad
var rWheel = 2.105 / (2 * Math.PI);
var CAL_TIME = "2026-11-23 15:41";
function omega(kmh) { return kmh / 3.6 / R; }
function mLeer(kmh) { var w = omega(kmh); return A0 + B0 * w * w; }
function mRad(kmh)  { var w = omega(kmh) * R / rWheel; return (A1 + B1 * w * w) * R / rWheel; }
function crrTrue(kmh, warm) { return (0.00405 + 0.000011 * (kmh - 15)) * (warm ? 1 : 1.07); }
function gauss() { var u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function mTotal(kmh, warm) { return mLeer(kmh) + mRad(kmh) + crrTrue(kmh, warm) * LOAD * R; }

// ---------- Zustand ----------
var S = { soll: 0, ist: 0, step: 0, meta: {}, checks: [], warn: [], points: [], warmup: [],
  anchor: null, baseline: [], nachlauf: null, tareSigma: null, ctrlDev: null, startTime: null,
  faultInjected: false };
var SPEEDUP = 60;
var tickers = [];
function $(id) { return document.getElementById(id); }
function fmt(x, d) { return (x === null || x === undefined || isNaN(x)) ? "—" : x.toFixed(d).replace(".", ","); }
function now() { return new Date(); }
function hm(d) { return d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2); }
function warn(code, text) { S.warn.push(code + " " + text); }

// Drehzahlsimulation: Ist folgt Soll mit Rampe
setInterval(function () {
  var dt = 0.2 * SPEEDUP / 10;   // gebremste Simulation, damit man die Rampe sieht
  var diff = S.soll - S.ist;
  var step = Math.min(Math.abs(diff), 2.2 * dt);
  if (S.soll < S.ist && S.ist > 45 && S.soll === 0) step = Math.min(Math.abs(diff), 0.47 * dt); // Auslauf ueber 45
  S.ist += Math.sign(diff) * step;
  if (Math.abs(diff) < 0.4) S.ist = S.soll + 0.15 * gauss();
  if (S.ist < 0) S.ist = 0;
  $("soll").innerHTML = fmt(S.soll, 0) + "<small>km/h</small>";
  $("ist").innerHTML = fmt(S.ist, 1) + "<small>km/h</small>";
  var steady = Math.abs(S.ist - S.soll) < 1 && S.soll > 0;
  var lt = $("liveTiles");
  if (S.soll > 0) {
    lt.hidden = false;
    if (steady) {
      var m = mTotal(S.ist, S.step >= 10) + 0.004 * gauss();
      var p = m * omega(S.ist);
      var croh = m / R / LOAD, ckor = (m - mLeer(S.ist) - mRad(S.ist)) / R / LOAD;
      $("lvM").innerHTML = fmt(m, 3) + "<small>Nm</small>";
      $("lvP").innerHTML = fmt(p, 1) + "<small>W</small>";
      $("lvC").innerHTML = fmt(croh, 4);
      $("lvK").innerHTML = fmt(ckor, 4);
    } else {
      $("lvM").innerHTML = "—<small>Nm</small>"; $("lvP").innerHTML = "—<small>W</small>";
      $("lvC").innerHTML = "—"; $("lvK").innerHTML = "—";
    }
  } else { lt.hidden = true; }
}, 200);

// ---------- Schritte ----------
var STEPS = [
  { id: 1,  grp: "A", t: "Lauf anlegen",             tag: "Eingabe" },
  { id: 2,  grp: "A", t: "Sichtprüfung, Not-Aus",    tag: "Hand" },
  { id: 3,  grp: "A", t: "Systemprüfung",            tag: "auto" },
  { id: 4,  grp: "A", t: "Nullen",                   tag: "auto" },
  { id: 5,  grp: "A", t: "Kontrollgewicht",          tag: "Hand · optional" },
  { id: 6,  grp: "A", t: "Leerlaufmodell",           tag: "Hand + auto" },
  { id: 7,  grp: "A", t: "Radmodell",                tag: "Hand + auto" },
  { id: 8,  grp: "A", t: "Rad aufgelegt, Auflast",   tag: "Hand" },
  { id: 9,  grp: "B", t: "Warmlauf 28,8 km/h · 30 min", tag: "auto" },
  { id: 10, grp: "B", t: "Plateaus, je 3 × 10 Umdrehungen", tag: "auto" },
  { id: 11, grp: "B", t: "Ankerpunkt 28,8 km/h",     tag: "auto" },
  { id: 12, grp: "B", t: "Auslaufen",                tag: "auto" },
  { id: 13, grp: "C", t: "Nachlauf Leerlauf",        tag: "Hand · optional" },
  { id: 14, grp: "C", t: "Protokoll",                tag: "auto" }
];
var state = {}; // id -> {cls, sub}

function renderLists() {
  ["A", "B", "C"].forEach(function (g) {
    var html = "";
    STEPS.filter(function (s) { return s.grp === g; }).forEach(function (s) {
      var st = state[s.id] || {};
      var cls = st.cls || (s.id === S.step ? "now" : "");
      html += '<li class="' + cls + '"><span class="k">' + s.id + '</span>' + s.t +
        '<span class="tag">' + s.tag + '</span>' + (st.sub ? '<small>' + st.sub + '</small>' : '') + '</li>';
    });
    $("list" + g).innerHTML = html;
  });
}
function done(id, sub, cls) { state[id] = { cls: cls || "done", sub: sub || "" }; }
function setHint(t) { var h = $("hint"); h.hidden = !t; h.textContent = t || ""; }
function setErr(t) { var e = $("err"); e.hidden = !t; e.textContent = t || ""; }
function clearTickers() { tickers.forEach(clearInterval); tickers = []; }
function go(step) { clearTickers(); S.step = step; renderLists(); PANEL[step](); window.scrollTo(0, 0); }

var PANEL = {};

// 1 Lauf anlegen
PANEL[1] = function () {
  $("panel").innerHTML =
    '<div class="title">Lauf anlegen</div>' +
    '<div class="cols"><div class="field"><label>Reifen</label><input id="fTire" value="Conti GP5000 S TR 28"></div>' +
    '<div class="field"><label>Laufrad</label><select id="fWheel"><option>LR-01 DT Swiss 1850, 28″</option><option>LR-02 Mavic</option></select></div></div>' +
    '<div class="cols three"><div class="field"><label>Druck</label><input id="fBar" value="5,0" inputmode="decimal"> </div>' +
    '<div class="field"><label>Raum °C</label><input id="fTemp" value="" placeholder="—" inputmode="decimal"></div>' +
    '<div class="field"><label>Auflast kg</label><input id="fLoad" value="50,4" inputmode="decimal"></div></div>' +
    '<div class="cols"><div class="field"><label>Laufgewicht Position mm</label><input id="fPos" value="312" inputmode="numeric"></div>' +
    '<div class="field"><label>Notiz</label><input id="fNote" value="A/B/A, Referenz 1"></div></div>' +
    '<div class="btns"><button class="go wide" onclick="finish1()">Weiter</button></div>';
};
function finish1() {
  S.meta = { tire: $("fTire").value, wheel: $("fWheel").value, bar: $("fBar").value, temp: $("fTemp").value,
    load: $("fLoad").value, pos: $("fPos").value, note: $("fNote").value };
  if (!S.meta.temp) warn("W07", "Raumtemperatur nicht eingetragen");
  S.startTime = now();
  done(1, S.meta.tire + " · " + S.meta.wheel + " · " + S.meta.bar + " bar · " + S.meta.load + " kg");
  go(2);
}

// 2 Sichtpruefung
PANEL[2] = function () {
  $("panel").innerHTML =
    '<div class="title">Sichtprüfung</div>' +
    '<div class="txt">Trommel, Wiegeteil frei, Kupplung, Rad gesichert, Blockierkeil raus, Not-Aus griffbereit.</div>' +
    '<div class="btns"><button class="go wide" onclick="done(2, \'bestätigt \' + hm(now())); go(3)">Geprüft</button></div>';
};

// 3 Systempruefung (auto)
PANEL[3] = function () {
  var checks = [
    ["Regler", "ok", "FW 7.01 · 41,9 V · kein Fehler"],
    ["Motor am Regler", "ok", "Trennung ruhig"],
    ["Wägezelle", "ok", "antwortet · 2 % vom Endwert"],
    ["Rauschen Stillstand", "ok", "σ = 1,8 Counts (5 s)"],
    ["Kalibrierfaktor", "ok", "2,668e-5 N/Count · " + CAL_TIME],
    ["Tara", "miss", "älter als letzter Eingriff → Schritt 4"],
    ["Leerlaufmodell A₀/B₀", "miss", "gespeichert 11:52, 4 Punkte · älter als Sitzung → Schritt 6"],
    ["Radmodell A₁/B₁", "ok", "LR-01 · 18:02 · J = 0,0765 kg·m²"],
    ["Radumfang", "ok", "2105 mm · stetig, 10 U"],
    ["Plateaus", "ok", "15 · 28,8 · 40 · 50 · 60 km/h"]
  ];
  S.checks = checks;
  var html = '<div class="title">Systemprüfung</div><div class="tablewrap"><table><tr><th>Prüfung</th><th>Ergebnis</th><th>Wert</th></tr>';
  checks.forEach(function (c, i) {
    html += '<tr id="chk' + i + '"><td>' + c[0] + '</td><td class="dim">…</td><td class="dim"></td></tr>';
  });
  html += '</table></div><div class="btns"><button class="go wide" id="b3" disabled>Weiter</button></div>';
  $("panel").innerHTML = html;
  var i = 0;
  var t = setInterval(function () {
    if (i >= checks.length) { clearInterval(t); $("b3").disabled = false;
      $("b3").onclick = function () { done(3, "8 ok · 2 fällig"); go(4); }; return; }
    var c = checks[i], row = $("chk" + i);
    row.cells[1].className = c[1]; row.cells[1].textContent = c[1] === "ok" ? "ok" : "fällig";
    row.cells[2].className = ""; row.cells[2].textContent = c[2];
    i++;
  }, 180);
  tickers.push(t);
};

// 4 Nullen
PANEL[4] = function () {
  $("panel").innerHTML = '<div class="title">Nullen</div><div class="txt">Trommel steht. 200 Werte.</div>' +
    '<div class="bar"><div id="bar4"></div></div><div class="small" id="t4">—</div>' +
    '<div class="btns"><button class="go wide" id="b4" disabled>Weiter</button></div>';
  var n = 0, t = setInterval(function () {
    n += 8; $("bar4").style.width = Math.min(100, n / 2) + "%";
    if (n >= 200) { clearInterval(t); S.tareSigma = 1.7 + 0.3 * Math.random();
      $("t4").textContent = "Offset 269 878 Counts · σ = " + fmt(S.tareSigma, 1) + " Counts";
      $("b4").disabled = false; $("b4").onclick = function () { done(4, "σ " + fmt(S.tareSigma, 1) + " Counts"); go(5); }; }
  }, 60);
  tickers.push(t);
};

// 5 Kontrollgewicht
PANEL[5] = function () {
  $("panel").innerHTML = '<div class="title">Kontrollgewicht</div>' +
    '<div class="txt">1000 g bei 330 mm anhängen. Soll 3,237 Nm.</div>' +
    '<div class="tiles"><div class="tile half"><div><div class="lab">Ist</div><div class="val" id="cw">—<small>Nm</small></div></div></div>' +
    '<div class="tile half"><div><div class="lab">Abweichung</div><div class="val" id="cd">—<small>%</small></div></div></div></div>' +
    '<div class="btns"><button class="half" onclick="skip5()">Überspringen</button><button class="go half" onclick="hang5()">Hängt</button></div>';
};
function skip5() { warn("W01", "Kontrollgewicht übersprungen"); done(5, "übersprungen (W01)", "skip"); go(6); }
function hang5() {
  var val = 3.237 * (1 + 0.0028 * gauss()), dev = (val / 3.237 - 1) * 100;
  S.ctrlDev = dev;
  $("cw").innerHTML = fmt(val, 3) + "<small>Nm</small>";
  $("cd").innerHTML = (dev >= 0 ? "+" : "") + fmt(dev, 2) + "<small>%</small>";
  var ok = Math.abs(dev) < 0.5;
  $("panel").querySelector(".btns").innerHTML = ok
    ? '<button class="go wide" onclick="done(5, \'' + (dev >= 0 ? "+" : "") + fmt(dev, 2) + ' %\'); go(6)">Weiter</button>'
    : '<button class="half" onclick="PANEL[5]()">Nochmal</button><button class="stop half" onclick="setErr(\'Kontrollgewicht ' + fmt(dev, 2) + ' %: Kalibrierung prüfen\')">Abbruch</button>';
}

// 6 Leerlaufmodell
PANEL[6] = function () {
  $("panel").innerHTML = '<div class="title">Leerlaufmodell</div>' +
    '<div class="txt">Gespeichert 11:52, 4 Punkte, älter als diese Sitzung.</div>' +
    '<div class="btns"><button class="half" onclick="keep6()">Übernehmen</button><button class="go half" onclick="lift6()">Neu fahren</button></div>';
};
function keep6() { warn("W02", "Leerlaufmodell älter als die Sitzung übernommen"); done(6, "übernommen 11:52 (W02)", "skip"); go(7); }
function lift6() {
  $("panel").innerHTML = '<div class="title">Rad abheben</div><div class="txt">Exzenterhebel. Rad frei von der Trommel.</div>' +
    '<div class="btns"><button class="go wide" onclick="runBaseline(6)">Abgehoben</button></div>';
}
var PLATEAUS = [15, 28.8, 40, 50, 60];
function runBaseline(step) {
  var pts = [];
  var html = '<div class="title">' + (step === 6 ? "Leerlauf Vorlauf" : "Leerlauf Nachlauf") + '</div>' +
    '<div class="tablewrap"><table id="tb"><tr><th>km/h</th><th>M Nm</th><th>σ</th>' + (step === 13 ? '<th>Δ zu Vorlauf</th><th>auf F_roll</th>' : '') + '</tr></table></div>' +
    '<div class="small" id="fit"></div><div class="btns"><button class="go wide" id="bB" disabled>Weiter</button></div>';
  $("panel").innerHTML = html;
  var i = 0;
  function next() {
    if (i >= PLATEAUS.length) {
      S.soll = 0; setHint("");
      if (step === 6) {
        S.baseline = pts;
        var fit = fitAB(pts);
        $("fit").textContent = "A₀ = " + fmt(fit.a, 4) + " Nm · B₀ = " + fit.b.toExponential(3).replace(".", ",") + " Nm/(rad/s)² · Drift zu 11:52: +1,9 %";
        $("bB").disabled = false;
        $("bB").onclick = function () { done(6, "A₀ " + fmt(fit.a, 4) + " · B₀ " + fit.b.toExponential(2).replace(".", ",") + " · 5 Punkte"); lower6(); };
      } else {
        S.nachlauf = pts;
        var worst = 0; pts.forEach(function (p, k) { worst = Math.max(worst, Math.abs(p.m - S.baseline[k].m) / R); });
        $("fit").textContent = "größte Abweichung " + fmt(worst, 3) + " N auf F_roll · Kriterium 0,02 N → " + (worst < 0.02 ? "ok" : "verwerfen");
        if (worst >= 0.02) warn("W08", "Leerlaufdrift " + fmt(worst, 3) + " N über 0,02 N");
        $("bB").disabled = false;
        $("bB").onclick = function () { done(13, "Drift max " + fmt(worst, 3) + " N"); go(14); };
      }
      return;
    }
    var v = PLATEAUS[i]; S.soll = v; setHint("Plateau " + fmt(v, 1) + " km/h · einschwingen");
    var wait = setInterval(function () {
      if (Math.abs(S.ist - v) < 1) { clearInterval(wait);
        setTimeout(function () {
          var m = mLeer(v) * (step === 13 ? 1.012 : 1) + 0.003 * gauss(), sg = 0.002 + 0.002 * Math.random();
          pts.push({ v: v, m: m, s: sg });
          var tr = $("tb").insertRow(-1);
          var cells = [fmt(v, 1), fmt(m, 4), fmt(sg, 4)];
          if (step === 13) { var d = m - S.baseline[i].m; cells.push((d >= 0 ? "+" : "") + fmt(d, 4)); cells.push(fmt(Math.abs(d) / R, 3) + " N"); }
          cells.forEach(function (c) { var td = tr.insertCell(-1); td.textContent = c; });
          i++; next();
        }, 900);
      }
    }, 100);
    tickers.push(wait);
  }
  next();
}
function fitAB(pts) { // M = a + b w^2, kleinste Quadrate
  var n = pts.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
  pts.forEach(function (p) { var x = omega(p.v); x *= x; sx += x; sy += p.m; sxx += x * x; sxy += x * p.m; });
  var b = (n * sxy - sx * sy) / (n * sxx - sx * sx), a = (sy - b * sx) / n; return { a: a, b: b };
}

function drawSpark() {
  var c = $("sp9"); if (!c) return; var g = c.getContext("2d"); g.clearRect(0, 0, 800, 70);
  g.strokeStyle = "#2f6f99"; g.lineWidth = 2; g.beginPath();
  var ps = S.warmup.map(function (w) { return w.p; }), mx = Math.max.apply(null, ps), mn = Math.min.apply(null, ps) - 0.5;
  S.warmup.forEach(function (w, i) { var x = 10 + i / 29 * 780, y = 62 - (w.p - mn) / (mx - mn + 0.01) * 54; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
}

function plateauStats() {
  return PLATEAUS.map(function (v) {
    var ps = S.points.filter(function (p) { return p.v === v && p.ok; });
    var n = ps.length, mm = ps.reduce(function (a, p) { return a + p.m; }, 0) / n;
    var sd = Math.sqrt(ps.reduce(function (a, p) { return a + (p.m - mm) * (p.m - mm); }, 0) / Math.max(1, n - 1));
    var mR = mm - mLeer(v) - mRad(v);
    var ukor = Math.sqrt(Math.pow(sd / Math.sqrt(n) / mR, 2) + Math.pow(0.002, 2) + Math.pow(0.00125, 2) + Math.pow(0.005, 2) + Math.pow(0.02 * R / mR, 2) + Math.pow(0.005, 2));
    return { v: v, n: n, m: mm, sd: sd, froll: mR / R, croh: mm / R / LOAD, ckor: mR / R / LOAD, u: ukor * mR / R / LOAD, all: S.points.filter(function (p) { return p.v === v; }).length };
  });
}
function protokoll() {

  L.push("| Nullen | ok | σ = " + fmt(S.tareSigma, 1) + " Counts |");
  L.push("| Kontrollgewicht | " + (S.ctrlDev === null ? "übersprungen" : "ok") + " | " + (S.ctrlDev === null ? "W01" : (S.ctrlDev >= 0 ? "+" : "") + fmt(S.ctrlDev, 2) + " %") + " |");
  L.push("");
  L.push("## Kalibrierstand");
  L.push("| Größe | Wert | Herkunft | Stand |"); L.push("|---|---|---|---|");
  L.push("| U Trommel | 2,842 m | gemessen | 2026-11-23 |");
  L.push("| L Zellenarm | 0,084 m | gemessen | 2026-11-23 |");
  L.push("| N_per_count | 2,668e-5 N | kalibriert 1 kg @ 330 mm | " + CAL_TIME + " |");
  L.push("| A₀ / B₀ | " + fmt(A0, 4) + " Nm / " + B0.toExponential(2).replace(".", ",") + " | Leerlauf 5 Punkte | " + (state[6] && state[6].cls === "skip" ? "11:52 (W02)" : hm(d)) + " |");
  L.push("| A₁ / B₁ / J_Rad | " + fmt(A1, 5) + " / " + B1.toExponential(3).replace(".", ",") + " / 0,0765 kg·m² | Auslauf LR-01 | 18:02 |");
  L.push("| Radumfang | 2,105 m | Drehzahlverhältnis, 10 U | 18:02 |");
  L.push("");
  L.push("## Warmlauf 28,8 km/h");

  if (S.warmup.length >= 6) { var a = S.warmup[S.warmup.length - 6].p, b = S.warmup[S.warmup.length - 1].p; L.push(""); L.push("Änderung letzte 5 min: " + fmt((b / a - 1) * 100, 1) + " %"); }
  L.push("");
  L.push("## Messpunkte");
  L.push("| v km/h | n | M Nm | σ Nm | F_roll N | Crr roh | Crr korr. | u(Crr) |"); L.push("|---|---|---|---|---|---|---|---|");
  plateauStats().forEach(function (s) {
    L.push("| " + fmt(s.v, 1) + " | " + s.n + "/" + s.all + " | " + fmt(s.m, 4) + " | " + fmt(s.sd, 4) + " | " + fmt(s.froll, 3) + " | " + fmt(s.croh, 5) + " | " + fmt(s.ckor, 5) + " | ± " + fmt(s.u, 5) + " |");
  });
  L.push("");
  L.push("## Anker 28,8 km/h");
  if (S.anchor) L.push("ΔM " + (S.anchor.d >= 0 ? "+" : "") + fmt(S.anchor.d, 4) + " Nm · ΔCrr " + (S.anchor.dcrr >= 0 ? "+" : "") + fmt(S.anchor.dcrr, 5) + " · " + fmt(Math.abs(S.anchor.d) / R, 3) + " N auf F_roll");
  L.push("");
  L.push("## Leerlauf Vor/Nach");
  if (S.nachlauf) {
    L.push("| v km/h | vor Nm | nach Nm | Δ auf F_roll N |"); L.push("|---|---|---|---|");
    S.nachlauf.forEach(function (p, i) { L.push("| " + fmt(p.v, 1) + " | " + fmt(S.baseline[i].m, 4) + " | " + fmt(p.m, 4) + " | " + fmt(Math.abs(p.m - S.baseline[i].m) / R, 3) + " |"); });

  return L.join("\n");
}
