; Bicycle tire test stand — firmware
;
; ONE environment, ONE main program, ONE UI. The former split into
; main firmware (stub drive, LCD) and test-run variant (controller over UART) was
; resolved on 2026-11-20: the drive runs via the VESC, and whatever never drove the
; motor is gone. Rationale in docs/04-hardware.md §14.

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Bakes firmware/web/index.html into src/webui_html.h before compiling.
; That way src/webui_html.h cannot go stale — index.html is always what gets edited.
extra_scripts = pre:web/embed_pio.py

; Module WROOM-1 N16R8: 16 MB quad flash + 8 MB octal PSRAM.
; qio_opi is exactly this combination — with the default qio_qspi the board does not boot.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; The flash holds settings (NVS) and, without an SD card, the run reports on the
; data partition of the table above (3.4 MB, label "spiffs", LittleFS). Raw data goes
; only to the SD (src/rawlog.h). A larger partition was briefly planned on 2026-11-25
; and was withdrawn again on 2026-11-26.
board_build.filesystem = littlefs

; ARDUINO_USB_CDC_ON_BOOT puts `Serial` on the native USB socket instead of UART0.
;
; Reason, observed on 2026-11-18: there was only ONE port (/dev/cu.usbmodem101).
; esptool talked to the chip over it, but the console stayed silent -- Serial was
; on UART0, i.e. on the COM socket, where no cable was plugged in. With the flag
; the console reports on the same port immediately.
;
; The COM socket worked on 2026-11-15 (docs/04-hardware.md §5.1). Whoever
; uses it again removes the flag or reads Serial0.
build_flags =
    -Wall
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; NimBLE: one sensor, one connection; host protocol logs quiet.
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=5

; Tire pressure: SKS AIRSPY over BLE (src/tirepressure.cpp). The same library as in the
; sister project ~/git/airspy (Arduino IDE there, version 2.3.6).
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.6

; HOST TESTS (Unity), without ESP32:   cd firmware && pio test -e native
; Tested are the Arduino-free calculation cores in src/calc/ (least-squares line,
; scatter, loss model, spin-down fit, time format, JSON string) and the
; VESC packet framing (src/vesc/packet.cpp). Since 2026-11-25.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*> +<vesc/packet.cpp>
build_flags = -std=c++17 -Wall -I${PROJECT_DIR}/src
test_build_src = yes
