; Fahrrad-Reifenprüfstand — Firmware
;
; Der Standard-Build nutzt den Stub-Antrieb und braucht KEINE externen Bibliotheken.
; Damit kompiliert und läuft der Trockentest sofort.

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Backt firmware/web/index.html nach src/webui_html.h, bevor compiliert wird.
; Damit kann src/webui_html.h nicht veralten — editiert wird immer index.html.
extra_scripts = pre:web/embed_pio.py

; Modul WROOM-1 N16R8: 16 MB Quad-Flash + 8 MB Octal-PSRAM.
; qio_opi ist genau diese Kombination — mit der Vorgabe qio_qspi bootet das Board nicht.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; PlatformIO uebersetzt sonst ALLES unter src/ — auch das Hauptprogramm der
; Reglervariante, was zu zwei setup() fuehrt.
build_src_filter =
    +<*>
    -<vesc_main.cpp>
    -<vesc/>

build_flags =
    -Wall
    -DDRIVE_STUB
    -DBOARD_HAS_PSRAM

; Variante für die Inbetriebnahme am vorhandenen SimpleFOCShield v2.
; Nur schwach belastbar (2 A / 24 V), siehe docs/04-hardware.md.
;
; lib_deps ist bewusst noch NICHT gesetzt: SimpleFOC ab 2.3 verlangt Arduino-esp32 3.x
; (ESP-IDF 5), die offizielle PlatformIO-Plattform espressif32 liefert aber 2.x.
; Dafür braucht es den pioarduino-Fork der Plattform. Entschieden wird das erst,
; wenn dieser Pfad wirklich gegangen wird — siehe docs/06-offene-fragen.md B5.
; SimpleFocDrive enthält bis dahin keine SimpleFOC-Aufrufe, der Build bleibt grün.
[env:esp32s3-simplefoc]
extends = env:esp32s3
build_flags =
    -Wall
    -DDRIVE_SIMPLEFOC
    -DBOARD_HAS_PSRAM

; Reglervariante: faehrt NUR den Motorregler ueber UART. Keine Waegezelle, keine
; Hall-Geber, kein LCD, keine Zustandsmaschine — drei Draehte zum Regler, und er
; liefert Drehzahl, Spannung, Strom, Temperatur und Fehlercode von selbst.
; Zweck: den Antriebsstrang kennenlernen, bevor ein Messwert ansteht.
; Plan und Begruendung: docs/04-hardware.md §14.
[env:esp32s3-vesc]
extends = env:esp32s3
; ARDUINO_USB_CDC_ON_BOOT legt `Serial` auf die native USB-Buchse statt auf UART0.
;
; Grund, am 2026-11-18 gemessen: es war nur EIN Port da (/dev/cu.usbmodem101).
; esptool redete darueber mit dem Chip, aber die Konsole blieb stumm -- Serial lag
; auf UART0, also auf der Buchse COM, an der kein Kabel steckte. Mit dem Flag
; meldet sich die Konsole auf demselben Port sofort.
;
; Die Buchse COM hat am 2026-11-15 funktioniert (docs/04-hardware.md §5.1). Wer
; sie wieder benutzt, nimmt das Flag heraus oder liest Serial0.
build_flags =
    -Wall
    -DBOARD_HAS_PSRAM
    -DVARIANT_VESC
    -DARDUINO_USB_CDC_ON_BOOT=1
; PlatformIO uebersetzt sonst ALLES unter src/. Die Messkette fliegt hier raus,
; damit die Variante wirklich minimal ist und nicht nur so tut.
; torque.cpp, settings.cpp und speedctl.cpp bleiben DRIN: die Variante faehrt die
; ersten Testlaeufe und zeigt dabei die Waegezelle. Draussen bleibt alles, was eine
; Zustandsmaschine, Trommelmarken, LCD oder Protokoll braucht.
build_src_filter =
    +<*>
    -<main.cpp>
    -<state.cpp>
    -<speed.cpp>
    -<logger.cpp>
    -<display.cpp>
    -<tirepressure.cpp>
    -<drive.cpp>
; Eigene Oberflaeche, also eigenes Backskript — extends erbt extra_scripts sonst
; vom Hauptbuild und wuerde index.html backen.
extra_scripts = pre:web/embed_vesc.py
